<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* TEMA ALTO CONTRASTE (Fundo Preto, Cards Brancos) */
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar Customizada */
        .navbar-custom {
            background-color: #000000;
            border-bottom: 1px solid #333333;
            padding: 1rem 0;
        }
        .nav-link-custom {
            color: #aaaaaa;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 1rem;
            transition: color 0.2s;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            color: #ffffff;
        }

        .card { 
            background-color: #ffffff; 
            color: #000000; 
            border: none; 
            border-radius: 8px; 
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.05);
        }

        .card-header { 
            background-color: transparent; 
            color: #000000; 
            border-bottom: 1px solid #eeeeee; 
            font-weight: 600; 
            font-size: 0.95rem; 
            padding: 1rem 1.5rem;
        }

        .form-floating > .form-control, .form-select-custom {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #cccccc;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        
        .form-floating > .form-control:focus, .form-select-custom:focus {
            border-color: #000000;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
            outline: none;
        }

        .form-floating > label { color: #777777; }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #000000;
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            font-weight: 500;
        }

        .btn-custom { 
            background-color: #000000; color: #ffffff; border-radius: 6px; font-weight: 500; padding: 0.6rem 1.2rem; border: none; transition: all 0.2s ease;
        }
        .btn-custom:hover:not(:disabled) { background-color: #333333; color: #ffffff; transform: translateY(-1px); }
        .btn-custom:disabled { background-color: #dddddd; color: #999999; cursor: not-allowed; }

        .btn-outline-custom { background-color: transparent; color: #ffffff; border: 1px solid #ffffff; border-radius: 6px; font-size: 0.85rem; }
        .btn-outline-custom:hover { background-color: #ffffff; color: #000000; }
        
        .btn-outline-dark-custom { background-color: transparent; color: #000000; border: 1px solid #000000; border-radius: 6px; font-size: 0.85rem; }
        .btn-outline-dark-custom:hover { background-color: #000000; color: #ffffff; }

        /* Tabela Customizada */
        .table-custom { color: #000000; vertical-align: middle; }
        .table-custom th { color: #777777; font-weight: 500; font-size: 0.85rem; text-transform: uppercase; border-bottom: 2px solid #eeeeee; }
        .table-custom td { border-bottom: 1px solid #eeeeee; padding: 1rem 0.5rem; }

        /* Toasts */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1055; }
        .toast-custom { background-color: #ffffff; border: none; color: #000000; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 12px rgba(255,255,255,0.15); }
        .toast-custom .btn-close { filter: invert(1); }
    </style>
</head>
<body>

<nav id="nav-superior" class="navbar-custom d-none">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <h5 class="m-0 fw-bold text-white me-4" style="letter-spacing: -1px;">ERP</h5>
            <span class="nav-link-custom active" id="nav-cadastros" onclick="mudarTela('painel')">Cadastros</span>
            <span class="nav-link-custom" id="nav-comandas" onclick="mudarTela('comandas')">Comandas</span>
        </div>
        <button class="btn btn-outline-custom btn-sm" onclick="fazerLogout()">Sair</button>
    </div>
</nav>

<div id="tela-login" class="container mt-5" style="max-width: 400px; padding-top: 10vh;">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-white" style="letter-spacing: -1px;">Sistema ERP</h2>
        <p style="color: #aaaaaa;">Faça login para continuar</p>
    </div>
    <div class="card">
        <div class="card-body p-4">
            <form id="form-login" onsubmit="event.preventDefault(); fazerLogin();">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="login-usuario" placeholder="Usuário" required>
                    <label>Usuário</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="login-senha" placeholder="Senha" required>
                    <label>Senha</label>
                </div>
                <button type="submit" id="btn-login" class="btn btn-custom w-100 d-flex justify-content-center align-items-center">
                    <span id="btn-login-text">Entrar</span>
                    <div id="btn-login-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></div>
                </button>
            </form>
        </div>
    </div>
</div>

<div id="tela-painel" class="container mt-5 d-none pb-5 view-section">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0 text-white" style="letter-spacing: -1px;">Cadastros</h3>
    </div>
    <div class="card mb-5">
        <div class="card-header">Novo Produto</div>
        <div class="card-body p-4">
            <form id="form-produto" onsubmit="event.preventDefault(); criarProduto();">
                <div class="row g-3">
                    <div class="col-md-6"><div class="form-floating"><input type="text" class="form-control" id="prod-nome" placeholder="Nome" required><label>Nome do Produto</label></div></div>
                    <div class="col-md-3"><div class="form-floating"><input type="text" class="form-control" id="prod-codigo" placeholder="Código"><label>Código Interno</label></div></div>
                    <div class="col-md-3"><div class="form-floating"><input type="text" class="form-control" id="prod-barras" placeholder="Barras"><label>Cód. Barras</label></div></div>
                    <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" id="prod-categoria" placeholder="Categoria"><label>Categoria</label></div></div>
                    <div class="col-md-4"><div class="form-floating"><input type="number" class="form-control" id="prod-preco" step="0.01" placeholder="Preço" required><label>Preço (R$)</label></div></div>
                    <div class="col-md-4"><div class="form-floating"><input type="number" class="form-control" id="prod-estoque" placeholder="Estoque" required><label>Estoque Inicial</label></div></div>
                    <div class="col-12 mt-4 text-end">
                        <button type="submit" id="btn-produto" class="btn btn-custom px-4"><span id="btn-produto-text">Salvar Produto</span><div id="btn-produto-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></div></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header">Novo Usuário</div>
        <div class="card-body p-4">
            <form id="form-usuario" onsubmit="event.preventDefault(); criarUsuario();">
                <div class="row g-3">
                    <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" id="user-nome" placeholder="Nome" required><label>Nome Completo</label></div></div>
                    <div class="col-md-4"><div class="form-floating"><input type="email" class="form-control" id="user-email" placeholder="Email" required><label>E-mail</label></div></div>
                    <div class="col-md-4"><div class="form-floating"><input type="text" class="form-control" id="user-telefone" placeholder="Telefone" required><label>Telefone</label></div></div>
                    <div class="col-12 mt-4 text-end">
                        <button type="submit" id="btn-usuario" class="btn btn-custom px-4"><span id="btn-usuario-text">Criar Usuário</span><div id="btn-usuario-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></div></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="tela-comandas" class="container mt-5 d-none pb-5 view-section">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0 text-white" style="letter-spacing: -1px;">Gestão de Comandas</h3>
        <button class="btn btn-custom bg-white text-dark" onclick="abrirModalComanda()">+ Adicionar Comanda</button>
    </div>

    <div class="card">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover table-custom" id="tabela-comandas">
                    <thead>
                        <tr>
                            <th>ID / Identificação</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th class="text-end">Valor Total</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-comandas">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Carregando comandas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalNovaComanda" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius: 8px; border: none; background-color: #ffffff;">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold text-dark">Abertura de Comanda</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="comanda-identificacao" placeholder="Mesa ou Cliente" required>
                            <label>Identificação (Ex: Mesa 12 ou Nome do Cliente)</label>
                        </div>
                    </div>
                </div>

                <div class="p-3 mb-4" style="background-color: #f8f9fa; border-radius: 6px; border: 1px solid #eeeeee;">
                    <h6 class="fw-bold mb-3 text-dark">Adicionar Produtos</h6>
                    <div class="row g-2 align-items-center">
                        <div class="col-md-7">
                            <select id="comanda-produto-select" class="form-select form-select-custom p-3">
                                <option value="" disabled selected>Carregando produtos...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="number" id="comanda-produto-qtd" class="form-control p-3" placeholder="Qtd" value="1" min="1">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-dark-custom w-100 p-3" onclick="adicionarItemNaComanda()">Add</button>
                        </div>
                    </div>
                </div>

                <h6 class="fw-bold text-dark">Itens da Comanda</h6>
                <table class="table table-sm table-custom mt-2">
                    <thead><tr><th>Produto</th><th>Qtd</th><th class="text-end">Ação</th></tr></thead>
                    <tbody id="tbody-itens-comanda">
                        <tr><td colspan="3" class="text-center text-muted small py-3">Nenhum item adicionado</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer border-top bg-light">
                <button type="button" class="btn btn-outline-dark-custom" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-custom" id="btn-salvar-comanda" onclick="salvarComanda()">
                    <span id="btn-salvar-comanda-text">Finalizar Comanda</span>
                    <div id="btn-salvar-comanda-spinner" class="spinner-border spinner-border-sm ms-2 d-none"></div>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_BASE_URL = 'https://localhost:5001'; 
    let modalComandaInstance;
    let itensComandaTemporaria = []; // Guarda os itens adicionados antes de salvar
    let produtosDisponiveis = []; // Cache do GET /api/Produto

    window.onload = function() {
        modalComandaInstance = new bootstrap.Modal(document.getElementById('modalNovaComanda'));
        if (localStorage.getItem('jwtToken')) {
            iniciarSessao();
        }
    };

    function mostrarNotificacao(mensagem, tipo = 'success') {
        const container = document.getElementById('toast-container');
        const icon = tipo === 'success' ? '✅' : '❌';
        const color = tipo === 'success' ? '#000000' : '#dc3545';
        const toastHtml = `<div class="toast toast-custom align-items-center border-0 show"><div class="d-flex"><div class="toast-body d-flex align-items-center gap-2 fw-medium"><span>${icon}</span><span>${mensagem}</span></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
        const el = document.createElement('div'); el.innerHTML = toastHtml; container.appendChild(el.firstElementChild);
        setTimeout(() => { if (container.firstChild) container.removeChild(container.firstChild); }, 4000);
    }

    function getAuthHeaders() {
        return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('jwtToken')}` };
    }

    // --- ROTEAMENTO SPA ---
    function iniciarSessao() {
        document.getElementById('tela-login').classList.add('d-none');
        document.getElementById('nav-superior').classList.remove('d-none');
        mudarTela('painel');
    }

    function fazerLogout() {
        localStorage.removeItem('jwtToken');
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('d-none'));
        document.getElementById('nav-superior').classList.add('d-none');
        document.getElementById('tela-login').classList.remove('d-none');
        document.getElementById('form-login').reset();
    }

    function mudarTela(telaAlvo) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('d-none'));
        document.getElementById(`tela-${telaAlvo}`).classList.remove('d-none');
        
        document.getElementById('nav-cadastros').classList.remove('active');
        document.getElementById('nav-comandas').classList.remove('active');
        document.getElementById(`nav-${telaAlvo}`).classList.add('active');

        if (telaAlvo === 'comandas') {
            carregarComandas();
        }
    }

    // --- AUTENTICAÇÃO E CADASTROS (Mantidos como estavam) ---
    async function fazerLogin() {
        const u = document.getElementById('login-usuario').value; const s = document.getElementById('login-senha').value;
        const form = new FormData(); form.append('usuario', u); form.append('senha', s);
        try {
            const res = await fetch(`${API_BASE_URL}/api/Token`, { method: 'POST', body: form });
            if (res.ok) { localStorage.setItem('jwtToken', (await res.json()).access_token); iniciarSessao(); }
            else if (res.status === 401) { mostrarNotificacao('Usuário ou senha incorretos.', 'error'); }
        } catch (e) { mostrarNotificacao('Erro de conexão.', 'error'); }
    }

    // [Funções criarProduto() e criarUsuario() foram omitidas do escopo visual do JS para focar nas Comandas, mas você deve manter as originais que te enviei antes aqui!]

    // --- GESTÃO DE COMANDAS ---

    async function carregarComandas() {
        const tbody = document.getElementById('tbody-comandas');
        try {
            const res = await fetch(`${API_BASE_URL}/api/Comanda`, { headers: getAuthHeaders() });
            if (!res.ok) throw new Error();
            const comandas = await res.json();
            
            tbody.innerHTML = '';
            if (comandas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Nenhuma comanda encontrada.</td></tr>`;
                return;
            }

            comandas.forEach(c => {
                // Ajuste os nomes das propriedades abaixo de acordo com a ViewModel que sua API devolve
                const idFormatado = c.id ? c.id.substring(0,8) : 'N/A';
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${idFormatado}</td>
                        <td>${new Date().toLocaleDateString()}</td>
                        <td><span class="badge bg-dark">Aberta</span></td>
                        <td class="text-end fw-bold">R$ 0,00</td>
                        <td class="text-center"><button class="btn btn-sm btn-outline-danger" onclick="deletarComanda('${c.id}')">Excluir</button></td>
                    </tr>
                `;
            });
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-danger">Erro ao carregar comandas.</td></tr>`;
        }
    }

    async function abrirModalComanda() {
        itensComandaTemporaria = [];
        document.getElementById('comanda-identificacao').value = '';
        renderizarTabelaItens();
        modalComandaInstance.show();

        // Busca produtos para o Select (ATENÇÃO: Requer GET /api/Produto no seu Backend)
        const select = document.getElementById('comanda-produto-select');
        try {
            const res = await fetch(`${API_BASE_URL}/api/Produto`, { headers: getAuthHeaders() });
            if (res.ok) {
                produtosDisponiveis = await res.json();
                select.innerHTML = '<option value="" disabled selected>Selecione um produto...</option>';
                produtosDisponiveis.forEach(p => {
                    select.innerHTML += `<option value="${p.id}" data-nome="${p.nome}">${p.nome} - R$ ${p.preco}</option>`;
                });
            }
        } catch (e) {
            select.innerHTML = '<option value="" disabled>Erro ao carregar produtos</option>';
        }
    }

    function adicionarItemNaComanda() {
        const select = document.getElementById('comanda-produto-select');
        const qtdInput = document.getElementById('comanda-produto-qtd');
        
        if (!select.value) return mostrarNotificacao('Selecione um produto!', 'error');
        
        const produtoId = select.value;
        const nomeProduto = select.options[select.selectedIndex].getAttribute('data-nome');
        const quantidade = parseInt(qtdInput.value) || 1;

        itensComandaTemporaria.push({ produtoId, nomeProduto, quantidade });
        
        // Limpa inputs
        select.value = '';
        qtdInput.value = '1';
        renderizarTabelaItens();
    }

    function renderizarTabelaItens() {
        const tbody = document.getElementById('tbody-itens-comanda');
        tbody.innerHTML = '';
        
        if (itensComandaTemporaria.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted small py-3">Nenhum item adicionado</td></tr>`;
            return;
        }

        itensComandaTemporaria.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.nomeProduto}</td>
                    <td>${item.quantidade}x</td>
                    <td class="text-end"><button class="btn btn-sm text-danger border-0 p-0" onclick="removerItemComanda(${index})">Remover</button></td>
                </tr>
            `;
        });
    }

    function removerItemComanda(index) {
        itensComandaTemporaria.splice(index, 1);
        renderizarTabelaItens();
    }

    async function salvarComanda() {
        const identificacao = document.getElementById('comanda-identificacao').value;
        if (!identificacao) return mostrarNotificacao('Informe a identificação (Mesa/Cliente).', 'error');

        // MONTANDO O PAYLOAD PARA SUA API
        // Ajuste os nomes das propriedades para dar "Match" perfeito com a sua CriarComandaViewModel no C#
        const payload = {
            Identificacao: identificacao,
            Itens: itensComandaTemporaria.map(i => ({
                ProdutoId: i.produtoId,
                Quantidade: i.quantidade
            }))
        };

        const btnSpinner = document.getElementById('btn-salvar-comanda-spinner');
        btnSpinner.classList.remove('d-none');

        try {
            const res = await fetch(`${API_BASE_URL}/api/Comanda`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                mostrarNotificacao('Comanda criada com sucesso!');
                modalComandaInstance.hide();
                carregarComandas(); // Recarrega a tabela
            } else {
                mostrarNotificacao('Erro ao criar comanda.', 'error');
            }
        } catch (e) {
            mostrarNotificacao('Erro de conexão.', 'error');
        } finally {
            btnSpinner.classList.add('d-none');
        }
    }

    async function deletarComanda(id) {
        if (!confirm('Deseja realmente excluir esta comanda?')) return;
        
        try {
            const res = await fetch(`${API_BASE_URL}/api/Comanda/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });

            if (res.ok) {
                mostrarNotificacao('Comanda excluída!');
                carregarComandas();
            } else {
                mostrarNotificacao('Erro ao excluir.', 'error');
            }
        } catch (e) {
            mostrarNotificacao('Erro de conexão.', 'error');
        }
    }
</script>

</body>
</html>
